<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07130d">
  <title>Boar Alert: Protect the Crops</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07130d; }
    #unity-container { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #07130d; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #07130d; }
    #unity-footer { display: none !important; }
    #unity-loading-bar { z-index: 4; }
    .screen-overlay {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box; background: rgba(3, 12, 7, .82);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
    }
    .screen-overlay[hidden] { display: none; }
    .overlay-card { max-width: 430px; padding: 28px 30px; border: 1px solid #c9963e; border-radius: 18px; background: #13281b; box-shadow: 0 16px 50px #0008; }
    .overlay-card h1 { margin: 0 0 10px; color: #f2c96a; font-size: 24px; }
    .overlay-card p { margin: 0 0 20px; color: #e8f0e7; line-height: 1.55; }
    .overlay-card button { border: 0; border-radius: 10px; padding: 13px 22px; color: #172516; background: #f2c96a; font-weight: 800; font-size: 16px; cursor: pointer; }
    #rotate-overlay { display: none; }
    body.mobile-portrait #rotate-overlay { display: grid; }
    body.mobile-portrait #start-overlay { display: none; }
    body.mobile-portrait #unity-container { visibility: hidden; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <div id="rotate-overlay" class="screen-overlay" role="status">
    <div class="overlay-card">
      <h1>가로 화면으로 돌려주세요</h1>
      <p>이 게임은 가로 화면에서 플레이하도록 제작되었습니다.<br>휴대폰을 가로로 돌리면 게임이 시작됩니다.</p>
    </div>
  </div>
  <div id="start-overlay" class="screen-overlay" hidden>
    <div class="overlay-card">
      <h1>Boar Alert</h1>
      <p>전체 화면으로 게임을 시작합니다.<br>모바일에서는 가로 화면이 유지됩니다.</p>
      <button id="start-fullscreen" type="button">전체 화면으로 플레이</button>
    </div>
  </div>

  <script>
    const canvas = document.querySelector('#unity-canvas');
    const startOverlay = document.querySelector('#start-overlay');
    const startButton = document.querySelector('#start-fullscreen');
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    function updateOrientation() {
      document.body.classList.toggle('mobile-portrait', isMobile && window.innerHeight > window.innerWidth);
    }
    updateOrientation();
    window.addEventListener('resize', updateOrientation);
    window.addEventListener('orientationchange', updateOrientation);

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector('#unity-warning');
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.cssText = type === 'error' ? 'background:#b3261e;color:#fff;padding:10px' : 'background:#f2c96a;color:#172516;padding:10px';
      warningBanner.appendChild(div);
      warningBanner.style.display = 'block';
      if (type !== 'error') setTimeout(() => div.remove(), 5000);
    }

    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/WebGL.data.unityweb',
      frameworkUrl: buildUrl + '/WebGL.framework.js.unityweb',
      codeUrl: buildUrl + '/WebGL.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'k-magpie',
      productName: 'Boar Alert: Protect the Crops',
      productVersion: '0.1.0',
      showBanner: unityShowBanner
    };

    document.querySelector('#unity-loading-bar').style.display = 'block';
    const script = document.createElement('script');
    script.src = buildUrl + '/WebGL.loader.js';
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.querySelector('#unity-progress-bar-full').style.width = (100 * progress) + '%';
      }).then(unityInstance => {
        document.querySelector('#unity-loading-bar').style.display = 'none';
        startOverlay.hidden = false;
        startButton.addEventListener('click', async () => {
          try {
            if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          } catch (_) {}
          try {
            if (isMobile && screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
          } catch (_) {}
          try { unityInstance.SetFullscreen(1); } catch (_) {}
          startOverlay.hidden = true;
          updateOrientation();
        }, { once: true });
      }).catch(message => unityShowBanner(message, 'error'));
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
