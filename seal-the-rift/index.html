<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Seal the Rift</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style id="seal-the-rift-webgl-polish">
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #020814;
      }
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
      #unity-container.unity-desktop #unity-canvas,
      #unity-container.unity-mobile #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: auto;
      }
      #unity-footer { display: none; }
      #unity-canvas:focus-visible { outline: 3px solid #58e9ff; outline-offset: 3px; }
      #unity-loading-bar { width: min(320px, calc(100vw - 32px)); text-align: center; }
      #unity-logo { margin: 0 auto; }
      #unity-progress-bar-empty { margin: 12px auto 0; }
      #submission-loading-text {
        margin-top: 12px;
        color: #d9f7ff;
        font: 600 14px/1.5 Arial, sans-serif;
        letter-spacing: 0.02em;
      }
      #unity-fullscreen-button[role="button"] { border: 0; padding: 0; }
      #unity-fullscreen-button:focus-visible { outline: 3px solid #58e9ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Seal the Rift</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLSubmission.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLSubmission.data.unityweb",
        frameworkUrl: buildUrl + "/WebGLSubmission.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGLSubmission.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "k-magpie",
        productName: "Seal the Rift",
        productVersion: "1.0.5",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "540px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>

    <script id="seal-the-rift-webgl-accessibility">
      (function () {
        "use strict";
        var isKorean = /^ko(?:-|$)/i.test(navigator.language || "");
        document.documentElement.lang = isKorean ? "ko" : "en";

        var viewports = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < viewports.length; i++) {
          viewports[i].setAttribute("content", "width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, shrink-to-fit=yes");
        }

        var canvas = document.querySelector("#unity-canvas");
        if (canvas) {
          canvas.tabIndex = 0;
          canvas.setAttribute("role", "application");
          canvas.setAttribute("aria-label", "Seal the Rift 게임 화면 / game canvas");
          canvas.addEventListener("pointerdown", function () {
            canvas.focus({ preventScroll: true });
          }, { passive: true });
        }

        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressTrack = document.querySelector("#unity-progress-bar-empty");
        var progressFill = document.querySelector("#unity-progress-bar-full");
        if (loadingBar) {
          loadingBar.setAttribute("role", "status");
          loadingBar.setAttribute("aria-label", isKorean ? "게임 데이터 로딩" : "Loading game data");
        }
        if (progressTrack) {
          progressTrack.setAttribute("role", "progressbar");
          progressTrack.setAttribute("aria-valuemin", "0");
          progressTrack.setAttribute("aria-valuemax", "100");
          progressTrack.setAttribute("aria-valuenow", "0");
        }

        var loadingText = document.createElement("div");
        loadingText.id = "submission-loading-text";
        loadingText.textContent = isKorean ? "게임 데이터 준비 중 · 0%" : "Preparing game data · 0%";
        if (loadingBar) loadingBar.appendChild(loadingText);

        function syncLoadingProgress() {
          if (!progressFill) return;
          var percent = Math.max(0, Math.min(100, Math.round(parseFloat(progressFill.style.width) || 0)));
          if (progressTrack) progressTrack.setAttribute("aria-valuenow", String(percent));
          loadingText.textContent = (isKorean ? "게임 데이터 준비 중 · " : "Preparing game data · ") + percent + "%";
        }
        if (progressFill && window.MutationObserver) {
          new MutationObserver(syncLoadingProgress).observe(progressFill, { attributes: true, attributeFilter: ["style"] });
        }
        syncLoadingProgress();

        var fullscreen = document.querySelector("#unity-fullscreen-button");
        if (fullscreen) {
          fullscreen.tabIndex = 0;
          fullscreen.setAttribute("role", "button");
          fullscreen.setAttribute("aria-label", isKorean ? "전체 화면" : "Enter fullscreen");
          fullscreen.setAttribute("title", isKorean ? "전체 화면" : "Enter fullscreen");
          fullscreen.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            fullscreen.click();
          });
        }
      }());
    </script>
  </body>
</html>
