<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Seal the Rift</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style id="seal-the-rift-webgl-polish">
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #020814;
      }
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
      #unity-container.unity-desktop #unity-canvas,
      #unity-container.unity-mobile #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: auto;
      }
      #unity-footer { display: none; }
      #unity-canvas:focus-visible { outline: 3px solid #58e9ff; outline-offset: 3px; }
      #unity-loading-bar { width: min(320px, calc(100vw - 32px)); text-align: center; }
      #unity-logo { margin: 0 auto; }
      #unity-progress-bar-empty { margin: 12px auto 0; }
      #submission-loading-text {
        margin-top: 12px;
        color: #d9f7ff;
        font: 600 14px/1.5 Arial, sans-serif;
        letter-spacing: 0.02em;
      }
      #unity-fullscreen-button[role="button"] { border: 0; padding: 0; }
      #unity-fullscreen-button:focus-visible { outline: 3px solid #58e9ff; outline-offset: 2px; }
    </style>
  <style id="seal-the-rift-orientation-style">
      html.seal-orientation-blocked #unity-container { pointer-events: none !important; }
      #seal-the-rift-orientation-gate[hidden] { display: none !important; }
      #seal-the-rift-orientation-gate {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        background:
          radial-gradient(circle at 50% 38%, rgba(46, 203, 255, 0.18), transparent 42%),
          radial-gradient(circle at 22% 82%, rgba(116, 74, 225, 0.16), transparent 38%),
          rgba(2, 8, 20, 0.985);
        color: #ecfbff;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      #seal-the-rift-orientation-panel {
        width: min(460px, calc(100vw - 40px));
        padding: clamp(24px, 6vw, 38px);
        box-sizing: border-box;
        border: 1px solid rgba(88, 233, 255, 0.62);
        border-radius: 22px;
        background: linear-gradient(150deg, rgba(12, 38, 67, 0.98), rgba(4, 13, 31, 0.98));
        box-shadow: 0 0 48px rgba(41, 205, 255, 0.22), inset 0 0 30px rgba(80, 219, 255, 0.08);
      }
      #seal-the-rift-orientation-kicker {
        margin: 0 0 18px;
        color: #78eaff;
        font: 700 12px/1.3 Arial, sans-serif;
        letter-spacing: 0.16em;
      }
      #seal-the-rift-orientation-device {
        position: relative;
        width: 68px;
        height: 102px;
        margin: 0 auto 22px;
        border: 4px solid #58e9ff;
        border-radius: 15px;
        box-sizing: border-box;
        box-shadow: 0 0 24px rgba(88, 233, 255, 0.35);
        animation: seal-the-rift-rotate-device 1.8s ease-in-out infinite;
      }
      #seal-the-rift-orientation-device::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 14px;
        height: 3px;
        border-radius: 3px;
        background: #58e9ff;
        transform: translateX(-50%);
      }
      #seal-the-rift-orientation-device::after {
        content: "↻";
        position: absolute;
        left: calc(100% + 13px);
        top: 50%;
        color: #ffd76a;
        font: 700 36px/1 Arial, sans-serif;
        transform: translateY(-50%);
        text-shadow: 0 0 14px rgba(255, 215, 106, 0.52);
      }
      #seal-the-rift-orientation-title {
        margin: 0 0 10px;
        font-size: clamp(23px, 6vw, 31px);
        line-height: 1.25;
      }
      #seal-the-rift-orientation-copy {
        margin: 0 auto 24px;
        max-width: 390px;
        color: #b9dce8;
        font-size: clamp(15px, 3.8vw, 18px);
        line-height: 1.55;
      }
      #seal-the-rift-orientation-action {
        width: min(320px, 100%);
        min-height: 58px;
        padding: 14px 22px;
        border: 1px solid #8af2ff;
        border-radius: 999px;
        background: linear-gradient(135deg, #1d9fc4, #7556d8);
        color: #fff;
        font: 700 clamp(16px, 4vw, 19px)/1.2 Arial, sans-serif;
        letter-spacing: 0.01em;
        box-shadow: 0 8px 28px rgba(46, 178, 234, 0.28);
        cursor: pointer;
        touch-action: manipulation;
      }
      #seal-the-rift-orientation-action:focus-visible {
        outline: 3px solid #ffd76a;
        outline-offset: 4px;
      }
      #seal-the-rift-orientation-action[aria-disabled="true"] { opacity: 0.68; cursor: wait; }
      @keyframes seal-the-rift-rotate-device {
        0%, 28% { transform: rotate(0deg); }
        62%, 100% { transform: rotate(90deg); }
      }
      @media (max-height: 520px) and (orientation: portrait) {
        #seal-the-rift-orientation-gate { align-items: flex-start; }
        #seal-the-rift-orientation-panel { padding: 18px 22px; }
        #seal-the-rift-orientation-kicker { margin-bottom: 10px; }
        #seal-the-rift-orientation-device { width: 52px; height: 76px; margin-bottom: 12px; border-width: 3px; }
        #seal-the-rift-orientation-device::after { display: none; }
        #seal-the-rift-orientation-title { margin-bottom: 6px; }
        #seal-the-rift-orientation-copy { margin-bottom: 14px; line-height: 1.4; }
        #seal-the-rift-orientation-action { min-height: 50px; padding: 10px 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #seal-the-rift-orientation-device { animation: none; transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Seal the Rift</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLSubmission.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLSubmission.data.unityweb",
        frameworkUrl: buildUrl + "/WebGLSubmission.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGLSubmission.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "k-magpie",
        productName: "Seal the Rift",
        productVersion: "1.0.5",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "540px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.sealTheRiftUnityInstance = unityInstance;
                if (typeof window.sealTheRiftSyncOrientationPause === "function") {
                  window.sealTheRiftSyncOrientationPause();
                }
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <script id="seal-the-rift-webgl-accessibility">
      (function () {
        "use strict";
        var isKorean = /^ko(?:-|$)/i.test(navigator.language || "");
        document.documentElement.lang = isKorean ? "ko" : "en";

        var viewports = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < viewports.length; i++) {
          viewports[i].setAttribute("content", "width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, shrink-to-fit=yes");
        }

        var canvas = document.querySelector("#unity-canvas");
        if (canvas) {
          canvas.tabIndex = 0;
          canvas.setAttribute("role", "application");
          canvas.setAttribute("aria-label", "Seal the Rift 게임 화면 / game canvas");
          canvas.addEventListener("pointerdown", function () {
            canvas.focus({ preventScroll: true });
          }, { passive: true });
        }

        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressTrack = document.querySelector("#unity-progress-bar-empty");
        var progressFill = document.querySelector("#unity-progress-bar-full");
        if (loadingBar) {
          loadingBar.setAttribute("role", "status");
          loadingBar.setAttribute("aria-label", isKorean ? "게임 데이터 로딩" : "Loading game data");
        }
        if (progressTrack) {
          progressTrack.setAttribute("role", "progressbar");
          progressTrack.setAttribute("aria-valuemin", "0");
          progressTrack.setAttribute("aria-valuemax", "100");
          progressTrack.setAttribute("aria-valuenow", "0");
        }

        var loadingText = document.createElement("div");
        loadingText.id = "submission-loading-text";
        loadingText.textContent = isKorean ? "게임 데이터 준비 중 · 0%" : "Preparing game data · 0%";
        if (loadingBar) loadingBar.appendChild(loadingText);

        function syncLoadingProgress() {
          if (!progressFill) return;
          var percent = Math.max(0, Math.min(100, Math.round(parseFloat(progressFill.style.width) || 0)));
          if (progressTrack) progressTrack.setAttribute("aria-valuenow", String(percent));
          loadingText.textContent = (isKorean ? "게임 데이터 준비 중 · " : "Preparing game data · ") + percent + "%";
        }
        if (progressFill && window.MutationObserver) {
          new MutationObserver(syncLoadingProgress).observe(progressFill, { attributes: true, attributeFilter: ["style"] });
        }
        syncLoadingProgress();

        var fullscreen = document.querySelector("#unity-fullscreen-button");
        if (fullscreen) {
          fullscreen.tabIndex = 0;
          fullscreen.setAttribute("role", "button");
          fullscreen.setAttribute("aria-label", isKorean ? "전체 화면" : "Enter fullscreen");
          fullscreen.setAttribute("title", isKorean ? "전체 화면" : "Enter fullscreen");
          fullscreen.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            fullscreen.click();
          });
        }
      }());
    </script>
  <script id="seal-the-rift-orientation-runtime">
      (function () {
        "use strict";

        var userAgent = navigator.userAgent || navigator.vendor || "";
        var userAgentDataMobile = navigator.userAgentData && navigator.userAgentData.mobile === true;
        var mobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
        var desktopModeIPad = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        var isMobileBrowser = userAgentDataMobile || mobileUserAgent || desktopModeIPad;
        if (!isMobileBrowser) return;

        var isKorean = /^ko(?:-|$)/i.test(navigator.language || "");
        var root = document.documentElement;
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var canvasTabIndex = canvas ? canvas.tabIndex : 0;
        var gate = document.createElement("div");
        gate.id = "seal-the-rift-orientation-gate";
        gate.hidden = true;
        gate.tabIndex = -1;
        gate.setAttribute("role", "dialog");
        gate.setAttribute("aria-modal", "true");
        gate.setAttribute("aria-labelledby", "seal-the-rift-orientation-title");
        gate.setAttribute("aria-describedby", "seal-the-rift-orientation-copy");

        var panel = document.createElement("div");
        panel.id = "seal-the-rift-orientation-panel";
        var kicker = document.createElement("p");
        kicker.id = "seal-the-rift-orientation-kicker";
        kicker.textContent = "SEAL THE RIFT · MOBILE WEBGL";
        var device = document.createElement("div");
        device.id = "seal-the-rift-orientation-device";
        device.setAttribute("aria-hidden", "true");
        var title = document.createElement("h1");
        title.id = "seal-the-rift-orientation-title";
        var copy = document.createElement("p");
        copy.id = "seal-the-rift-orientation-copy";
        copy.setAttribute("aria-live", "polite");
        var action = document.createElement("button");
        action.id = "seal-the-rift-orientation-action";
        action.type = "button";
        panel.appendChild(kicker);
        panel.appendChild(device);
        panel.appendChild(title);
        panel.appendChild(copy);
        panel.appendChild(action);
        gate.appendChild(panel);
        document.body.appendChild(gate);

        var wasVisible = false;
        var attemptPending = false;
        var attemptFailed = false;
        var orientationBlocked = false;
        var unityOrientationStateSent = null;
        var refreshTimerShort = 0;
        var refreshTimerLong = 0;

        function isPortraitViewport() {
          return window.innerHeight > window.innerWidth;
        }

        function syncUnityOrientationPause() {
          var unityInstance = window.sealTheRiftUnityInstance;
          if (!unityInstance || typeof unityInstance.SendMessage !== "function") return;
          if (unityOrientationStateSent === orientationBlocked) return;
          try {
            unityInstance.SendMessage(
              "RelaunchWebGLOrientationBridge",
              "SetOrientationBlocked",
              orientationBlocked ? "1" : "0");
            unityOrientationStateSent = orientationBlocked;
          } catch (error) {
            // The runtime may still be creating the bootstrap object. A later
            // orientation/viewport event or instance registration retries.
          }
        }
        window.sealTheRiftSyncOrientationPause = syncUnityOrientationPause;

        function setGameBlocked(blocked) {
          orientationBlocked = blocked;
          syncUnityOrientationPause();
          root.classList.toggle("seal-orientation-blocked", blocked);
          if (!container) return;
          if (blocked) {
            container.setAttribute("aria-hidden", "true");
          } else {
            container.removeAttribute("aria-hidden");
          }
          if ("inert" in container) container.inert = blocked;
          if (canvas) canvas.tabIndex = blocked ? -1 : canvasTabIndex;
        }

        function restoreLandscapeViewport(restoreFocus) {
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              window.dispatchEvent(new Event("resize"));
              if (restoreFocus && canvas) canvas.focus({ preventScroll: true });
            });
          });
        }

        function refreshOrientationGate() {
          var shouldShow = isPortraitViewport();
          if (!shouldShow) {
            var restoreFocus = gate.contains(document.activeElement);
            gate.hidden = true;
            gate.setAttribute("aria-hidden", "true");
            setGameBlocked(false);
            if (wasVisible) restoreLandscapeViewport(restoreFocus);
            wasVisible = false;
            return;
          }

          if (attemptPending) {
            title.textContent = isKorean ? "가로 화면 전환 중" : "Switching to landscape";
            copy.textContent = isKorean ? "전체 화면과 가로 방향을 요청하고 있습니다." : "Requesting fullscreen landscape mode.";
            action.textContent = isKorean ? "잠시만 기다려주세요" : "Please wait";
          } else if (attemptFailed) {
            title.textContent = isKorean ? "기기를 가로로 돌려주세요" : "Rotate to landscape";
            copy.textContent = isKorean
              ? "자동 전환을 완료하지 못했습니다. 화면 회전 잠금이 켜져 있다면 해제한 뒤 기기를 가로로 돌려주세요."
              : "We couldn't switch automatically. If orientation lock is on, turn it off and rotate your device.";
            action.textContent = isKorean ? "가로 전체 화면 다시 시도" : "Retry landscape fullscreen";
          } else {
            title.textContent = isKorean ? "가로 화면으로 돌려주세요" : "Rotate to landscape";
            copy.textContent = isKorean
              ? "SEAL THE RIFT는 가로 화면 전용입니다. 버튼을 누르거나 기기를 가로로 돌리면 계속됩니다."
              : "SEAL THE RIFT is designed for landscape play. Use the button or rotate your device to continue.";
            action.textContent = isKorean ? "가로 전체 화면으로 전환" : "Enter landscape fullscreen";
          }

          action.setAttribute("aria-disabled", attemptPending ? "true" : "false");
          gate.hidden = false;
          gate.setAttribute("aria-hidden", "false");
          setGameBlocked(true);
          if (canvas) canvas.blur();
          if (!wasVisible) {
            window.requestAnimationFrame(function () { action.focus({ preventScroll: true }); });
          }
          wasVisible = true;
        }

        function currentFullscreenElement() {
          return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function requestLandscapeMode() {
          var requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
          var fullscreenStep = Promise.resolve();
          if (!currentFullscreenElement() && typeof requestFullscreen === "function") {
            try {
              fullscreenStep = Promise.resolve(requestFullscreen.call(root));
            } catch (error) {
              fullscreenStep = Promise.reject(error);
            }
          }

          return fullscreenStep.catch(function () { return null; }).then(function () {
            var orientation = window.screen && window.screen.orientation;
            if (!orientation || typeof orientation.lock !== "function") return false;
            try {
              return Promise.resolve(orientation.lock("landscape"))
                .then(function () { return true; })
                .catch(function () { return false; });
            } catch (error) {
              return false;
            }
          });
        }

        action.addEventListener("click", function () {
          if (attemptPending) return;
          attemptPending = true;
          attemptFailed = false;
          refreshOrientationGate();
          requestLandscapeMode().then(function (locked) {
            attemptPending = false;
            attemptFailed = !locked && isPortraitViewport();
            refreshOrientationGate();
          }).catch(function () {
            attemptPending = false;
            attemptFailed = true;
            refreshOrientationGate();
          });
        });
        gate.addEventListener("keydown", function (event) {
          if (event.key !== "Tab") return;
          event.preventDefault();
          action.focus({ preventScroll: true });
        });

        function scheduleOrientationRefresh() {
          refreshOrientationGate();
          window.clearTimeout(refreshTimerShort);
          window.clearTimeout(refreshTimerLong);
          refreshTimerShort = window.setTimeout(refreshOrientationGate, 120);
          refreshTimerLong = window.setTimeout(refreshOrientationGate, 350);
        }

        window.addEventListener("resize", scheduleOrientationRefresh);
        window.addEventListener("orientationchange", scheduleOrientationRefresh);
        document.addEventListener("fullscreenchange", scheduleOrientationRefresh);
        document.addEventListener("webkitfullscreenchange", scheduleOrientationRefresh);
        if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
          window.screen.orientation.addEventListener("change", scheduleOrientationRefresh);
        }
        if (window.visualViewport && window.visualViewport.addEventListener) {
          window.visualViewport.addEventListener("resize", scheduleOrientationRefresh);
        }
        refreshOrientationGate();
      }());
    </script>
  </body>
